# Example bitcoin.conf for a Qcoin testnet (qtctest) node.
#
# Copy to the node's data directory as bitcoin.conf, or pass -conf=/path/to/qtctest.conf.
# Everything qtctest-specific lives in the [qtctest] section so the same file can also hold
# settings for other chains. Command-line options override anything here.

chain=qtctest

[qtctest]
# --- network -------------------------------------------------------------------------------
# P2P port for qtctest (default 28333). Open it in the firewall on seed nodes.
port=28333
# Accept inbound peers (seed nodes: 1). Leave at 0 on a laptop behind NAT.
listen=1
# Seed nodes to connect to. Replace with the real seed addresses once they exist;
# repeat the line for each seed. -connect=<ip> instead pins the node to exactly that peer.
#addnode=seed1.example.net:28333
#addnode=203.0.113.10:28333
maxconnections=40

# --- RPC -----------------------------------------------------------------------------------
server=1
rpcport=28332
# Keep RPC on localhost. The explorer and faucet run on the same machine and use the cookie
# file (<datadir>/qtctest/.cookie); do not expose RPC to the network.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# --- node ----------------------------------------------------------------------------------
# A transaction index lets the explorer resolve any txid instantly (otherwise it scans blocks).
txindex=1
dbcache=512

# --- wallet (faucet / tester nodes) --------------------------------------------------------
# ML-DSA scheme for witness v2 addresses: wallets created on this node get a tq1z address and
# getnewmldsaaddress derives more. Omit on a pure seed node that runs no wallet.
walletsigscheme=mldsa44
# No fee estimates exist on a young chain; the wallet needs a fallback to send.
fallbackfee=0.0001
# Pure seed node: uncomment to run without any wallet.
#disablewallet=1

# --- logging -------------------------------------------------------------------------------
#debug=net
#printtoconsole=0
